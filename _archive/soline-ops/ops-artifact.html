<title>Soline Ops · מרכז תפעול</title>
<style>
  :root{ --bg:#0b1119; --scr:#f4f7fb; --panel:#fff; --panel2:#eef3f9; --line:#dde5f0; --line2:#c6d2e2;
    --ink:#0e1f36; --ink2:#42567a; --muted:#7688a5; --accent:#0d6fbf; --accent-d:#0a5aa0; --accent-soft:#e7f1fb;
    --go:#0a9d63; --go-soft:#e6f6ef; --warn:#c67c10; --warn-soft:#fbf1e0; --bad:#d23a3f; --bad-soft:#fdecec; --ai:#6b3fc9; --ai-soft:#efe9fb;
    --mono:ui-monospace,"SF Mono","Consolas",monospace; --sans:ui-sans-serif,system-ui,"Segoe UI","Arial Hebrew",Arial,sans-serif; --r:15px; --sh:0 8px 26px -14px rgba(16,40,80,.28); }
  @media(prefers-color-scheme:dark){ :root{ --scr:#0a111d; --panel:#101b2c; --panel2:#16233a; --line:#25344a; --line2:#33475f; --ink:#e8effb; --ink2:#b3c4e0; --muted:#8296b6; --accent:#5cc8ff; --accent-soft:#12283e; --go:#2fce8f; --go-soft:#0f2a20; --warn:#f5b544; --warn-soft:#2a2110; --bad:#ff6b70; --bad-soft:#2c1416; --ai:#a78bfa; --ai-soft:#221a3a; } }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .rolebar{position:sticky;top:0;z-index:20;background:#0b1119;color:#fff;display:flex;align-items:center;gap:8px;padding:9px 14px;flex-wrap:wrap;border-bottom:1px solid #1c2836}
  .rolebar .lbl{font-size:11px;color:#7f93b0;font-family:var(--mono)}
  .rb{font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:10px;border:1px solid #26374a;background:#131e2b;color:#c3d3e8;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .rb[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rb.ai[aria-current="true"]{background:var(--ai);border-color:var(--ai)}
  .net{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
  .nettog{font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid #26374a;background:#131e2b;color:#8fe;cursor:pointer}
  .nettog.off{color:var(--warn);border-color:var(--warn)}
  .frame{max-width:1100px;margin:0 auto;padding:18px clamp(12px,3vw,28px) 60px}
  .frame.phone{max-width:410px}.frame.tablet{max-width:960px}
  .dev{display:inline-flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{font-size:clamp(20px,3vw,26px);font-weight:800;margin:0}.lead{color:var(--ink2);font-size:13.5px;margin:6px 0 0}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .tabs{display:flex;gap:7px;margin:16px 0;flex-wrap:wrap}
  .tab{font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink2)}
  .tab[aria-current="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
  .card h3{margin:0;font-size:15px;font-weight:750}
  .grp{font-size:10.5px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;margin:0 0 8px}
  .row{display:flex;align-items:center;gap:10px}
  .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
  .pill.new{background:var(--warn-soft);color:var(--warn)}.pill.ai{background:var(--ai-soft);color:var(--ai)}.pill.pend{background:var(--accent-soft);color:var(--accent)}.pill.appr{background:var(--go-soft);color:var(--go)}.pill.prog{background:var(--warn-soft);color:var(--warn)}.pill.done{background:var(--go-soft);color:var(--go)}
  .sub{font-size:12px;color:var(--ink2);margin-top:3px}
  .scope{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.sc{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--ink2)}
  .btn{border:none;border-radius:11px;padding:11px 16px;font-weight:800;font-size:13.5px;background:var(--accent);color:#fff;cursor:pointer;font-family:var(--sans)}
  .btn:hover{background:var(--accent-d)}.btn:disabled{opacity:.4}.btn.sec{background:transparent;border:1px solid var(--line2);color:var(--ink)}.btn.ai{background:var(--ai)}.btn.go{background:var(--go)}.btn.block{width:100%}
  .agentlog{background:#0d1420;color:#cfe;border-radius:11px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;min-height:40px;margin-top:10px}
  .agentlog .ok{color:#5fe3a0}.agentlog .wf{color:#f5b544}
  .estbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .eb{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}.eb .v{font-family:var(--mono);font-weight:800;font-size:15px}.eb .k{font-size:9px;color:var(--muted)}
  .price{background:var(--go-soft);border:1px dashed var(--go);border-radius:11px;padding:11px;margin:10px 0;font-size:12.5px}.price b{color:var(--go)}.price .lock{float:left;font-size:10px;color:var(--muted);font-family:var(--mono)}
  .assign{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px;align-items:end}
  .f label{display:block;font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:4px}.f select,.f input{width:100%;height:42px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:0 10px;color:var(--ink);font-size:14px}
  .toggle{width:46px;height:26px;border-radius:99px;border:none;background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto}
  .toggle.on{background:var(--go)}.toggle span{position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s}.toggle.on span{inset-inline-end:23px}
  .perm{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.perm .t{font-weight:600;font-size:13.5px}.perm .d{font-size:11.5px;color:var(--muted)}
  .noperm{background:var(--panel2);border:1px dashed var(--line2);border-radius:11px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px}
  /* surveyor phone bits */
  .job{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border-inline-start:4px solid var(--line2)}
  .job.appr{border-inline-start-color:var(--accent)}.job.done{border-inline-start-color:var(--go)}.job.prog{border-inline-start-color:var(--warn)}
  .job .nm{font-weight:750;font-size:15px}.job .ad{font-size:12px;color:var(--ink2);margin-top:2px}
  .ls{display:flex;gap:10px;padding:7px 0}.ls .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:0 0 auto;background:var(--panel)}.ls.done .dot{background:var(--go);border-color:var(--go);color:#fff}.ls.cur .dot{background:var(--accent);border-color:var(--accent);color:#fff}.ls .t{font-weight:600;font-size:13px}.ls .tm{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .handoff{background:var(--ai-soft);border:1px solid var(--ai);border-radius:13px;padding:16px;text-align:center;margin-top:12px}
  .handoff .code{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--ai);margin:8px 0}
  .back{border:none;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:0;margin-bottom:10px;font-size:14px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:26px}
  .sync{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-family:var(--mono);color:var(--muted)}
  .toast{position:fixed;inset-block-end:24px;inset-inline:0;margin:auto;width:max-content;max-width:80%;background:var(--ink);color:var(--scr);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:none}
  .mrow{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}.mrow b{font-family:var(--mono)}
</style>
<div class="rolebar">
  <span class="lbl">מחובר כ:</span>
  <button class="rb" data-role="admin">👑 אדמין</button>
  <button class="rb ai" data-role="agent">🤖 סוכן משרד</button>
  <button class="rb" data-role="phone">📱 מודד · טלפון</button>
  <button class="rb" data-role="tablet">📐 מודד · טאבלט</button>
  <div class="net"><button class="nettog" id="net">● מקוון</button></div>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
function est(o){var base=o.type=='stone'?50:40;var sc=(o.scope.counters||1)*8+(o.scope.cutouts||0)*6+(o.scope.openings||0)*5;var m=base+sc,tv=Math.round(o.distanceKm/40*60);return{measure:m,travel:tv,onsite:m+20,total:m+tv+20};}
function sizeClass(o){var s=(o.scope.counters||0)+(o.scope.cutouts||0)+(o.scope.openings||0);return s>=7?"גדול":s>=4?"בינוני":"קטן";}
var LIFE=[{id:"received",t:"התקבלה"},{id:"enroute",t:"בדרך ללקוח",act:"יצא לדרך",km:true},{id:"contacted",t:"יצירת קשר",act:"הגעתי + התקשרתי"},{id:"access",t:"בדיקת גישה",act:"גישה תקינה"},{id:"measuring",t:"מדידה",act:"פתח מדידה",measure:true},{id:"done",t:"סיום מדידה",act:"סיימתי למדוד"},{id:"submitted",t:"הגשה",act:"הגשתי לנגר"}];
var st=load()||{ role:"agent", online:true, tab:"approvals", jobId:null, agentBusy:null,
  surveyors:[{id:"m",name:"מיכאל"},{id:"y",name:"יותם"}],
  rates:{km:2.5,hr:130},
  orders:[
    {id:1,carpenter:"נגריית שגב",client:"משפחת כהן",address:"קרית אתא · הנמל 4",phone:"050-1112222",type:"stone",distanceKm:12,price:1550,status:"new",scope:{counters:2,cutouts:2,openings:0},analysis:null,assignedTo:null,slot:null,life:0,times:{},km:0,phoneException:false,handoff:null},
    {id:2,carpenter:"מטבחי גנדי",client:"אורן לוי",address:"חיפה · הרצל 88",phone:"052-3334444",type:"kitchen",distanceKm:8,price:700,status:"new",scope:{counters:1,cutouts:1,openings:1},analysis:null,assignedTo:null,slot:null,life:0,times:{},km:0,phoneException:false,handoff:null}
  ]};
function save(){try{localStorage.setItem("soline-ops",JSON.stringify(st));}catch(e){}}
function load(){try{var s=localStorage.getItem("soline-ops");return s?JSON.parse(s):null;}catch(e){return null;}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},1700);}
function fmt(m){var h=Math.floor(m/60),mm=Math.round(m%60);return(h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function money(n){return '₪'+Math.round(n).toLocaleString('he');}

/* ---- role bar ---- */
function bar(){document.querySelectorAll('.rb').forEach(function(b){b.setAttribute('aria-current',st.role==b.dataset.role);b.onclick=function(){st.role=b.dataset.role;st.jobId=null;st.tab=b.dataset.role=="admin"?"approvals":st.tab;render();};});
  var n=document.getElementById('net');n.textContent=st.online?'● מקוון':'○ לא מקוון';n.className='nettog'+(st.online?'':' off');n.onclick=function(){st.online=!st.online;save();render();toast(st.online?'חזרה לרשת · מסנכרן':'עבודה לא-מקוונת · יסונכרן בהגעה לרשת');};}

/* ---- render ---- */
function render(){bar();var a=document.getElementById('app');a.innerHTML=ROLE[st.role]();wire();save();}
var ROLE={
 agent:function(){var q=st.orders.filter(function(o){return o.status=="new"||o.status=="analyzing";});
   return '<div class="frame"><div class="dev">🤖 סוכן משרד AI · מקבל הזמנות מנגרים, מתקשר ללקוח, מאמת ומנתח היקף</div><h1>תיבת בקשות</h1><p class="lead">הסוכן מטפל בכל הזמנה אוטומטית ומעביר לאישור אדמין.</p>'+
   (q.length?q.map(agentCard).join(''):'<div class="empty">אין בקשות ממתינות. כולן טופלו ונשלחו לאישור.</div>')+
   '<div class="eyebrow" style="margin-top:18px">טופלו · ממתין לאדמין</div>'+
   (st.orders.filter(function(o){return o.status=="pending_admin";}).map(function(o){return '<div class="card"><div class="row"><span class="pill pend">נשלח לאדמין</span><b style="margin-inline-start:auto">'+o.client+'</b></div><div class="sub">'+o.carpenter+' · ניתוח: '+sizeClass(o)+' · '+est(o).total+' ד׳</div></div>';}).join('')||'<div class="empty">—</div>')+'</div>';},

 admin:function(){var t=st.tab;var tabs='<div class="tabs">'+[['approvals','אישורים ושיבוץ'],['day','סיכום יום ותמחור'],['perms','הרשאות']].map(function(x){return '<button class="tab" data-tab="'+x[0]+'" aria-current="'+(t==x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
   var c='';
   if(t=="approvals"){var p=st.orders.filter(function(o){return o.status=="pending_admin";});c=(p.length?p.map(approvalCard).join(''):'<div class="empty">אין עבודות לאישור. הסוכן יעביר לכאן לאחר ניתוח.</div>');}
   else if(t=="day")c=dayPricing();
   else c=permsScreen();
   return '<div class="frame"><div class="dev">👑 אדמין (אתה) · רואה תמחור, מאשר שיבוץ, מנהל הרשאות</div><h1>מרכז ניהול</h1>'+tabs+c+'</div>';},

 phone:function(){if(st.jobId)return '<div class="frame phone">'+jobDetail()+'</div>';
   var mine=st.orders.filter(function(o){return o.status=="approved"||o.status=="in_progress"||o.status=="delivered";});
   return '<div class="frame phone"><div class="dev">📱 מודד · טלפון <span class="sync">· '+(st.online?'☁ מסונכרן':'⤓ אופליין')+'</span></div><h1>המסלול שלי</h1><p class="lead">עבודות שאושרו ושובצו אליי. מדידה נפתחת בטאבלט.</p>'+
   (mine.length?mine.map(function(o){var cls=o.status=="delivered"?'done':o.status=="in_progress"?'prog':'appr';return '<div class="job '+cls+'" data-j="'+o.id+'"><div class="nm">'+o.client+'</div><div class="ad">'+o.address+' · '+o.carpenter+'</div><div class="row" style="margin-top:8px"><span class="pill '+(o.status=="delivered"?'done':o.status=="in_progress"?'prog':'appr')+'">'+(o.status=="delivered"?'הוגש ✓':o.status=="in_progress"?LIFE[o.life].t:'ממתין ליציאה')+'</span><span class="sc" style="margin-inline-start:auto">'+(o.type=="stone"?"שיש":"מטבח")+'</span></div></div>';}).join(''):'<div class="empty">אין עבודות משובצות עדיין.</div>')+
   '<div class="noperm" style="margin-top:14px">🔒 סיכום יום ותמחור — גלוי לאדמין בלבד</div></div>';},

 tablet:function(){if(st.jobId)return '<div class="frame tablet">'+tabletMeasure()+'</div>';
   var avail=st.orders.filter(function(o){return o.handoff&&o.status=="in_progress"&&o.life>=4&&o.life<6;});
   return '<div class="frame tablet"><div class="dev">📐 מודד · טאבלט <span class="sync">· '+(st.online?'☁ חשבון ענן מסונכרן':'⤓ עובד לא-מקוון · יסונכרן ברשת')+'</span></div><h1>מרחב המדידה</h1><p class="lead">עבודות שנפתחו למדידה מהטלפון (אותו חשבון ענן) מופיעות כאן — גם ללא קליטה.</p>'+
   (avail.length?avail.map(function(o){return '<div class="job appr" data-t="'+o.id+'"><div class="nm">'+o.client+'</div><div class="ad">'+o.address+' · קוד '+o.handoff+'</div><div class="row" style="margin-top:8px"><span class="pill prog">מוכן למדידה</span><button class="btn" style="margin-inline-start:auto" data-open="'+o.id+'">פתח מרחב מדידה ←</button></div></div>';}).join(''):'<div class="empty">אין עבודה שנפתחה למדידה. בטלפון: פתח עבודה → "פתח מדידה".</div>')+'</div>';}
};

function agentCard(o){var running=st.agentBusy==o.id;var e=est(o);
  return '<div class="card"><div class="row"><span class="pill '+(running?'ai':'new')+'">'+(running?'הסוכן מעבד…':'בקשה חדשה')+'</span><b style="margin-inline-start:auto">'+o.client+'</b></div>'+
   '<div class="sub">הזמנה מ<b>'+o.carpenter+'</b> · '+o.address+' · '+o.distanceKm+' ק״מ · '+(o.type=="stone"?"שיש":"מטבח")+'</div>'+
   '<div class="scope">'+scopeTags(o.scope)+'</div>'+
   (o._log?'<div class="agentlog" id="log'+o.id+'">'+o._log.join('<br>')+'</div>':'')+
   (o.analysis?'':'<div style="margin-top:12px"><button class="btn ai" data-agent="'+o.id+'" '+(running?'disabled':'')+'>🤖 הפעל סוכן AI</button></div>')+'</div>';}

function runAgent(id){var o=st.orders.find(function(x){return x.id==id;});if(!o||st.agentBusy)return;st.agentBusy=id;o._log=[];o.status="analyzing";render();
  var steps=[
    '↳ מתקשר ללקוח הסופי ('+o.client+')…',
    '<span class="ok">✓</span> אומת: כתובת '+o.address+' · טלפון '+o.phone,
    '↳ בודק גישה ותנאי שטח…',
    '<span class="ok">✓</span> גישה: '+(o.distanceKm>15?'קומה גבוהה — לתאם מעלית':'כניסה נוחה'),
    '↳ מנתח היקף הפרויקט…',
    '<span class="ok">✓</span> היקף: '+sizeClass(o)+' · '+o.scope.counters+' משטחים, '+o.scope.cutouts+' פתחים',
    '<span class="ok">✓</span> הערכת זמן: '+est(o).measure+' ד׳ מדידה + '+est(o).travel+' ד׳ נסיעה',
    '<span class="wf">→ נשלח לאישור אדמין</span>'
  ];var i=0;var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function tick(){if(i<steps.length){o._log.push(steps[i]);i++;var l=document.getElementById('log'+id);if(l)l.innerHTML=o._log.join('<br>');if(reduce){tick();}else setTimeout(tick,430);}
    else{o.analysis={contacted:true,size:sizeClass(o),flags:o.distanceKm>15?['לתאם מעלית']:[],est:est(o)};o.status="pending_admin";st.agentBusy=null;save();toast("הסוכן סיים — נשלח לאישור אדמין");render();}}
  tick();}

function approvalCard(o){var e=est(o);var cost=o.distanceKm*st.rates.km+(e.total/60)*st.rates.hr;var margin=o.price-cost;
  return '<div class="card"><div class="row"><span class="pill ai">נותח ע״י הסוכן</span><b style="margin-inline-start:auto">'+o.client+'</b></div>'+
   '<div class="sub">'+o.carpenter+' · '+o.address+' · '+o.distanceKm+' ק״מ · היקף '+o.analysis.size+(o.analysis.flags.length?' · ⚠ '+o.analysis.flags.join(', '):'')+'</div>'+
   '<div class="scope">'+scopeTags(o.scope)+'</div>'+
   '<div class="estbar"><div class="eb"><div class="v">'+e.measure+'</div><div class="k">מדידה (ד׳)</div></div><div class="eb"><div class="v">'+e.travel+'</div><div class="k">נסיעה</div></div><div class="eb"><div class="v">'+e.total+'</div><div class="k">סה״כ</div></div><div class="eb"><div class="v">'+o.analysis.size+'</div><div class="k">היקף</div></div></div>'+
   '<div class="price"><span class="lock">🔒 אדמין בלבד</span>מחיר לנגר <b>'+money(o.price)+'</b> · עלות תפעולית '+money(cost)+' · רווח <b>'+money(margin)+'</b></div>'+
   '<div class="assign"><div class="f"><label>שבץ למודד</label><select id="asg'+o.id+'">'+st.surveyors.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>';}).join('')+'</select></div><div class="f"><label>מומלץ (מרחק מינ׳)</label><input value="'+st.surveyors[0].name+' · 09:15" disabled></div><button class="btn go" data-approve="'+o.id+'">אשר ושבץ ←</button></div></div>';}

function dayPricing(){var done=st.orders.filter(function(o){return o.status=="delivered";});var km=st.orders.reduce(function(s,o){return s+o.km;},0);
  var revenue=done.reduce(function(s,o){return s+o.price;},0);var cost=done.reduce(function(s,o){var e=est(o);return s+o.distanceKm*st.rates.km+(e.total/60)*st.rates.hr;},0);
  return '<div class="card"><div class="grp">ניטור יום · מה שהמשרד רואה</div>'+
   '<div class="mrow"><span>עבודות שהוגשו</span><b>'+done.length+'</b></div><div class="mrow"><span>ק״מ מצטבר</span><b>'+km+' ק״מ</b></div>'+
   '<div class="mrow"><span>הכנסה (מחיר לנגרים)</span><b>'+money(revenue)+'</b></div><div class="mrow"><span>עלות תפעולית (ק״מ+זמן)</span><b>'+money(cost)+'</b></div><div class="mrow"><span>רווח תפעולי</span><b style="color:var(--go)">'+money(revenue-cost)+'</b></div></div>'+
   '<div class="card"><div class="grp">תעריפים (עריכה)</div><div class="assign" style="grid-template-columns:1fr 1fr"><div class="f"><label>₪ לק״מ</label><input id="rkm" value="'+st.rates.km+'"></div><div class="f"><label>₪ לשעה</label><input id="rhr" value="'+st.rates.hr+'"></div></div><button class="btn sec" id="saveRates" style="margin-top:10px">עדכן תעריפים</button></div>';}

function permsScreen(){return '<div class="card"><div class="grp">תפקידים והרשאות</div>'+
   [['👑 אדמין','תמחור, אישור שיבוץ, ניהול הרשאות, אישור חריגים'],['🤖 סוכן משרד','יצירת קשר, אימות, ניתוח היקף — ללא שיבוץ וללא תמחור'],['📱 מודד','מסלול ומדידה בלבד · ללא תמחור · מדידה בטאבלט']].map(function(r){return '<div class="perm"><div style="flex:1"><div class="t">'+r[0]+'</div><div class="d">'+r[1]+'</div></div></div>';}).join('')+'</div>'+
   '<div class="card"><div class="grp">חריגי מדידה מהטלפון</div><p class="sub" style="margin:0 0 8px">כברירת מחדל מדידה בטאבלט בלבד. אשר חריג רק במצב מיוחד.</p>'+
   st.orders.filter(function(o){return o.status=="approved"||o.status=="in_progress";}).map(function(o){return '<div class="perm"><div style="flex:1"><div class="t">'+o.client+'</div><div class="d">'+o.carpenter+'</div></div><button class="toggle '+(o.phoneException?'on':'')+'" data-exc="'+o.id+'"><span></span></button></div>';}).join('')+
   (st.orders.filter(function(o){return o.status=="approved"||o.status=="in_progress";}).length?'':'<div class="empty">אין עבודות פעילות.</div>')+'</div>';}

function scopeTags(sc){var a=[];if(sc.counters)a.push(sc.counters+' משטחים');if(sc.cutouts)a.push(sc.cutouts+' פתחים');if(sc.openings)a.push(sc.openings+' חלונות/דלתות');return a.map(function(t){return '<span class="sc">'+t+'</span>';}).join('');}

/* ---- surveyor phone job detail ---- */
function jobDetail(){var o=st.orders.find(function(x){return x.id==st.jobId;});if(!o)return '';
  var life='<div style="margin-top:6px">'+LIFE.map(function(s,i){var cls=i<o.life?'done':i==o.life?'cur':'';return '<div class="ls '+cls+'"><div class="dot">'+(i<o.life?'✓':i+1)+'</div><div><div class="t">'+s.t+'</div>'+(o.times[s.id]!=null?'<div class="tm">'+fmt(o.times[s.id])+'</div>':'')+'</div></div>';}).join('')+'</div>';
  var action='';var s=LIFE[o.life];
  if(o.life>=LIFE.length)action='<div class="handoff" style="background:var(--go-soft);border-color:var(--go)"><b style="color:var(--go)">✓ הוגש. סע לעבודה הבאה.</b></div>';
  else if(s.measure){
    if(o.handoff)action='<div class="handoff"><div class="grp" style="color:var(--ai)">מדידה נפתחה בטאבלט</div><div class="code">'+o.handoff+'</div><div class="sub">פתח את הטאבלט (אותו חשבון) והזן/סרוק את הקוד. עובד גם ללא קליטה.</div></div>';
    else{action='<button class="btn ai block" id="adv">פתח מדידה בטאבלט ↗</button>';
      if(o.phoneException)action+='<button class="btn sec block" id="advPhone" style="margin-top:8px">מדוד בטלפון (חריג · אושר ע״י אדמין)</button>';
      else action+='<div class="noperm" style="margin-top:8px">🔒 מדידה מהטלפון חסומה — נדרש אישור אדמין</div>';}
  } else action='<button class="btn block" id="adv">'+(s.act||'המשך')+'</button>';
  return '<button class="back" id="back">← חזרה למסלול</button><div class="card"><div class="row"><h3>'+o.client+'</h3><span class="pill '+(o.status=="delivered"?'done':'prog')+'" style="margin-inline-start:auto">'+(o.status=="delivered"?'הוגש':'בתהליך')+'</span></div><div class="sub">'+o.address+' · הזמנה מ'+o.carpenter+'</div>'+
   '<div class="row" style="gap:8px;margin-top:10px"><a class="btn sec" style="flex:1;text-align:center;text-decoration:none" href="tel:'+o.phone+'">📞 התקשר</a><a class="btn sec" style="flex:1;text-align:center;text-decoration:none" href="https://maps.google.com/?q='+encodeURIComponent(o.address)+'" target="_blank">🧭 ניווט</a></div>'+
   life+action+'</div>';}

function tabletMeasure(){var o=st.orders.find(function(x){return x.id==st.jobId;});if(!o)return '';
  return '<button class="back" id="backT">← חזרה</button><div class="card"><div class="grp">מרחב מדידה · חשבון ענן '+(st.online?'(מסונכרן)':'(אופליין)')+'</div><h1>'+o.client+'</h1><div class="sub">'+o.address+' · '+o.carpenter+' · '+(o.type=="stone"?"שיש ±1.5":"מטבח ±3")+' מ״מ</div>'+
   '<div class="scope">'+scopeTags(o.scope)+'</div>'+
   '<div class="handoff" style="margin-top:14px"><div class="grp" style="color:var(--ai)">אפליקציית המדידה</div><div class="sub">כאן נפתח מרחב המדידה המלא (חדר · אלמנטים · בקרה) — הנתונים נשמרים בחשבון ומסונכרנים כשחוזרת רשת.</div><button class="btn ai block" id="doMeasure" style="margin-top:12px">'+(o.life>=5?'המדידה הושלמה ✓':'סמן מדידה כהושלמה (דמו)')+'</button></div>'+
   (o.life>=5?'<button class="btn go block" id="submitT" style="margin-top:10px">הגש את המדידה לנגר</button>':'')+'</div>';}

/* ---- lifecycle advance ---- */
function advance(phone){var o=st.orders.find(function(x){return x.id==st.jobId;});if(!o)return;var s=LIFE[o.life];var e=est(o);
  if(s.measure&&!phone){o.handoff=(''+Math.floor(1000+Math.random()*8999));o.status="in_progress";toast("נפתח בטאבלט · קוד "+o.handoff);save();render();return;}
  if(o.status!="in_progress")o.status="in_progress";
  if(o.times.received==null)o.times.received=480;
  var add=s.km?0:(s.id=="done"?e.measure:5);if(o.life==0)o.time0=480;
  // set clock progression
  o._clock=(o._clock||480)+ (s.km? e.travel : (s.id=="done"? e.measure : (s.id=="submitted"?5:5)));
  if(s.km){o.km+=o.distanceKm;}
  o.life++;var ns=LIFE[o.life];if(ns)o.times[ns.id]=o._clock;
  if(o.life>=LIFE.length){o.status="delivered";}
  toast(s.act+" ✓");save();render();}

function wire(){
  document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.onclick=function(){st.tab=b.dataset.tab;render();};});
  document.querySelectorAll('[data-agent]').forEach(function(b){b.onclick=function(){runAgent(+b.dataset.agent);};});
  document.querySelectorAll('[data-approve]').forEach(function(b){b.onclick=function(){var o=st.orders.find(function(x){return x.id==+b.dataset.approve;});o.assignedTo=document.getElementById('asg'+o.id).value;o.status="approved";o.life=0;o.times={received:480};toast("אושר ושובץ ל"+st.surveyors.find(function(s){return s.id==o.assignedTo;}).name);save();render();};});
  document.querySelectorAll('[data-exc]').forEach(function(b){b.onclick=function(){var o=st.orders.find(function(x){return x.id==+b.dataset.exc;});o.phoneException=!o.phoneException;save();render();toast(o.phoneException?"אושר חריג: מדידה מהטלפון":"בוטל החריג");};});
  var sr=document.getElementById('saveRates');if(sr)sr.onclick=function(){st.rates.km=parseFloat(document.getElementById('rkm').value)||st.rates.km;st.rates.hr=parseFloat(document.getElementById('rhr').value)||st.rates.hr;save();render();toast("תעריפים עודכנו");};
  document.querySelectorAll('.job[data-j]').forEach(function(b){b.onclick=function(){st.jobId=+b.dataset.j;render();};});
  var back=document.getElementById('back');if(back)back.onclick=function(){st.jobId=null;render();};
  var adv=document.getElementById('adv');if(adv)adv.onclick=function(){advance(false);};
  var advP=document.getElementById('advPhone');if(advP)advP.onclick=function(){advance(true);};
  document.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){st.jobId=+b.dataset.open;render();};});
  var backT=document.getElementById('backT');if(backT)backT.onclick=function(){st.jobId=null;render();};
  var dm=document.getElementById('doMeasure');if(dm)dm.onclick=function(){var o=st.orders.find(function(x){return x.id==st.jobId;});if(o.life<5){o.life=5;o.times.done=(o._clock||480)+est(o).measure;o._clock=o.times.done;}save();render();toast("המדידה הושלמה");};
  var sub=document.getElementById('submitT');if(sub)sub.onclick=function(){var o=st.orders.find(function(x){return x.id==st.jobId;});o.life=6;o.times.submitted=(o._clock||480)+5;o.status="delivered";o.handoff=null;save();st.jobId=null;st.role="phone";render();toast("המדידה הוגשה לנגר ✓");};
}
render();
</script>
