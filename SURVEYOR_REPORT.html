<title>דו״ח מודד</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Poppins:wght@600&display=swap">
<style id="app-css">
  :root{
    --bg:#FBF4E6;--surface:#FFFFFF;--surface2:#FAF3E2;--text:#2B2620;--muted:#6E6656;
    --border:#EADFC7;--accent:#E8890B;--teal:#127C8C;
    --ok:#2E9E6B;--warn:#D97A0B;--upg:#127C8C;--keep:#8A7F6B;--pend:#B9AE97;
    --shadow:0 1px 2px rgba(74,58,20,.05),0 9px 24px rgba(74,58,20,.09);
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#15181A;--surface:#1E2427;--surface2:#232a2e;--text:#ECE7DB;--muted:#A7A093;
    --border:#2E3439;--accent:#F7AC3A;--teal:#3BB6C7;
    --ok:#54C08A;--warn:#EFA13F;--upg:#3BB6C7;--keep:#9A8F79;--pend:#5A5346;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }}
  :root[data-theme=dark]{
    --bg:#15181A;--surface:#1E2427;--surface2:#232a2e;--text:#ECE7DB;--muted:#A7A093;
    --border:#2E3439;--accent:#F7AC3A;--teal:#3BB6C7;
    --ok:#54C08A;--warn:#EFA13F;--upg:#3BB6C7;--keep:#9A8F79;--pend:#5A5346;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);direction:rtl;
    font-family:Heebo,system-ui,sans-serif;line-height:1.55;
    padding:max(15px,env(safe-area-inset-top)) 15px 60px}
  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
    border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:14px}
  .wm{font-family:Poppins,sans-serif;font-size:24px;color:var(--accent);line-height:1}.wm b{color:var(--teal)}
  h1{font-size:17px;font-weight:800;margin:3px 0 0}
  .meta{color:var(--muted);font-size:12px;text-align:left}
  .banner{background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:11px 14px;font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .banner b{color:var(--text)}
  .banner.ro{border-right:4px solid var(--warn)}
  .vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px}
  @media(max-width:560px){.vitals{grid-template-columns:repeat(3,1fr)}}
  .v{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 6px;
    text-align:center;box-shadow:var(--shadow)}
  .v .n{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .v .l{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .v.ok .n{color:var(--ok)}.v.improve .n{color:var(--warn)}.v.upgrade .n{color:var(--upg)}
  .v.keep .n{color:var(--keep)}.v.pend .n{color:var(--pend)}
  h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);
    font-weight:800;margin:20px 0 10px}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
  .item.done{border-inline-start:4px solid var(--ok)}
  .ttl{font-weight:700;font-size:15.5px;margin:0 0 3px}
  .dsc{font-size:12.5px;color:var(--muted);margin:0 0 11px}
  .btns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
  .sb{flex:1 1 auto;min-width:70px;border:1.5px solid var(--border);background:var(--surface2);
    color:var(--muted);border-radius:10px;padding:8px 6px;font-family:inherit;font-size:13px;
    font-weight:700;cursor:pointer;transition:.12s}
  .sb:active{transform:scale(.97)}
  .sb[aria-pressed=true]{color:#fff}
  .sb.ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
  .sb.improve[aria-pressed=true]{background:var(--warn);border-color:var(--warn)}
  .sb.upgrade[aria-pressed=true]{background:var(--upg);border-color:var(--upg)}
  .sb.keep[aria-pressed=true]{background:var(--keep);border-color:var(--keep)}
  .nt{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg);
    color:var(--text);font-family:inherit;font-size:13.5px;padding:9px 11px;resize:vertical;min-height:38px}
  .nt:focus{outline:2px solid var(--accent);outline-offset:1px}
  .st{font-size:11px;color:var(--muted);margin-top:6px;min-height:14px}
  .st.saving{color:var(--accent)}.st.saved{color:var(--ok)}
  .send{width:100%;margin-top:10px;border:none;border-radius:10px;background:var(--accent);
    color:#fff;font-family:inherit;font-size:14px;font-weight:800;padding:11px;cursor:pointer;transition:.12s}
  .send:active{transform:scale(.98)}
  .send:disabled{background:var(--pend);cursor:default;opacity:.7}
  .viewbtn{margin-top:8px;width:100%;border:1.5px solid var(--teal);background:transparent;color:var(--teal);
    border-radius:10px;padding:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .viewbtn:active{transform:scale(.98)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;z-index:100;padding:16px}
  .lightbox img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  .lbx{background:#fff;color:#2B2620;border:none;border-radius:999px;padding:10px 24px;
    font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .stbadge{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:800;
    padding:5px 13px;border-radius:999px;border:1.5px solid var(--border)}
  .stbadge.open{color:var(--warn);border-color:var(--warn)}
  .stbadge.ok{color:var(--ok);border-color:var(--ok)}
  .stbadge.improve{color:var(--warn);border-color:var(--warn)}
  .stbadge.upgrade{color:var(--upg);border-color:var(--upg)}
  .stbadge.keep{color:var(--keep);border-color:var(--keep)}
  .chatfab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:90;background:var(--teal);color:#fff;
    border:none;border-radius:999px;padding:11px 18px;font-family:inherit;font-weight:800;font-size:14px;
    cursor:pointer;box-shadow:var(--shadow)}
  .chatp{position:fixed;bottom:70px;inset-inline-start:16px;width:min(360px,calc(100vw - 32px));height:min(70vh,480px);
    background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
    z-index:90;display:flex;flex-direction:column;overflow:hidden}
  .chath{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;
    border-bottom:1px solid var(--border);background:var(--surface2);font-size:14px}
  .rolebtn{background:transparent;border:1.5px solid var(--teal);color:var(--teal);border-radius:999px;
    padding:4px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
  .chatmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
  .msg.me{align-self:flex-start}.msg.them{align-self:flex-end}
  .msg .who{font-size:10.5px;color:var(--muted);font-weight:700;padding:0 5px}
  .msg .bub{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word}
  .msg.me .bub{background:var(--teal);color:#fff}
  .msg.them .bub{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
  .chatin input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--bg);
    color:var(--text);font-family:inherit;font-size:14px;padding:9px 12px}
  .chatin button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;
    font-family:inherit;font-weight:800;cursor:pointer}
  footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center;
    border-top:1px solid var(--border);padding-top:14px}
  .tog{position:fixed;top:10px;inset-inline-start:10px;width:36px;height:36px;border-radius:999px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);box-shadow:var(--shadow);cursor:pointer}
</style>

    var it=state.items.filter(function(i){return i.id===id;})[0]; if(!it||!it.status)return;
    clearTimeout(timers[id]);            // לסגור הערה-ממתינה לפני שליחה
    it.submitted=true; it.submittedAt=new Date().toISOString();
    state.updated=it.submittedAt;
    render(); doPublish();               // נעלם מהמסך שלו, מגיע למיכאל
  }

  // ── צ'אט דו-כיווני מודד ↔ מיכאל ──
  var chatOpen=false, chatText='', role='s';
  try{ role=localStorage.getItem('soline_role')||'s'; }catch(e){}
  function scrollChat(){ setTimeout(function(){ var mm=document.getElementById('chatmsgs'); if(mm) mm.scrollTop=mm.scrollHeight; },30); }
  function sendChat(){
    var t=(chatText||'').trim(); if(!t||!canWrite)return;
    if(!state.chat) state.chat=[];
    state.chat.push({who:role, text:t, at:new Date().toISOString()});
    chatText=''; state.updated=new Date().toISOString();
    render(); doPublish(); scrollChat();
  }

  function render(){
    var root=document.getElementById('root'); if(!root)return;
    var pend=pending().length;
    var when = state.updated ? new Date(state.updated).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    var h='';
    h+='<div class="wrap">';
    h+='<div class="top"><div><div class="wm">soline<b>.<\/b><\/div><h1>דו״ח מודד · בדיקה-חוזרת<\/h1><\/div>'
      +'<div class="meta">עודכן<br>'+when+'<\/div><\/div>';
    if(!artifact){
      h+='<div class="banner">טוען…  אם זה לא-נטען — פתח את הקישור מחדש.<\/div>';
    } else if(!canWrite){
      h+='<div class="banner ro"><b>מצב-צפייה בלבד.<\/b> כדי לסמן — בקש ממיכאל גישת-עריכה לדף (Share → יכול לערוך).<\/div>';
    } else {
      h+='<div class="banner"><b>🐞 באגים חדשים<\/b> = מה שדיווחת, אנחנו מטפלים. <b>🔁 בדיקה חוזרת<\/b> = אחרי שתיקנו ושחררנו גרסה — בחר תקין/לשפר/לשדרג/לשמר, הוסף הערה, ו<b>שלח למיכאל<\/b>. הכל נשאר גלוי עם הסטטוס.<\/div>';
    }
    var newB=state.items.filter(function(i){return (i.stage||'retest')==='new';});
    var reT=state.items.filter(function(i){return (i.stage||'retest')==='retest';});
    var reTpend=reT.filter(function(i){return !i.submitted;});
    var verified=reT.filter(function(i){return i.submitted;});
    h+='<div class="vitals">'
      +'<div class="v improve"><div class="n">'+newB.length+'<\/div><div class="l">🐞 חדשים<\/div><\/div>'
      +'<div class="v pend"><div class="n">'+reTpend.length+'<\/div><div class="l">🔁 לבדיקה<\/div><\/div>'
      +'<div class="v ok"><div class="n">'+verified.length+'<\/div><div class="l">✅ נבדקו<\/div><\/div>'
      +'<\/div>';
    // ── באגים חדשים (המודד דיווח → אנחנו מטפלים; לא לסמן) ──
    h+='<h2>🐞 באגים חדשים ('+newB.length+')<\/h2>';
    if(newB.length===0) h+='<div class="item"><p class="dsc">אין באגים חדשים פתוחים ✓<\/p><\/div>';
    newB.forEach(function(it){
      h+='<div class="item">';
      h+='<p class="ttl">'+esc(it.t)+'<\/p><p class="dsc">'+esc(it.d)+'<\/p>';
      if(it.img) h+='<button class="viewbtn" data-view="'+it.id+'">📷 צפה בצילום-המסך<\/button>';
      h+='<div class="stbadge open">🔴 '+esc(it.owner||'נפתח · ממתין לתיקון')+'<\/div>';
      h+='<\/div>';
    });
    // ── בדיקה חוזרת (רק אחרי שתיקנו ושחררנו גרסה) ──
    h+='<h2>🔁 בדיקה חוזרת ('+reT.length+')<\/h2>';
    if(reT.length===0) h+='<div class="item"><p class="dsc">אין פריטים לבדיקה כרגע.<\/p><\/div>';
    reT.forEach(function(it){
      h+='<div class="item'+(it.submitted?' done':'')+'">';
      h+='<p class="ttl">'+esc(it.t)+'<\/p><p class="dsc">'+esc(it.d)+'<\/p>';
      if(it.img) h+='<button class="viewbtn" data-view="'+it.id+'">📷 צפה בצילום-המסך<\/button>';
      if(it.submitted){
        h+='<div class="stbadge '+it.status+'">✅ נבדק: '+(LBL[it.status]||it.status)+'<\/div>';
        if(it.note) h+='<p class="dsc" style="margin-top:6px">📝 '+esc(it.note)+'<\/p>';
      } else {
        h+='<div class="btns">';
        STAT.forEach(function(s){
          var on=it.status===s[0];
          h+='<button class="sb '+s[0]+'" aria-pressed="'+on+'" '+(canWrite?'':'disabled ')+'data-id="'+it.id+'" data-k="'+s[0]+'">'+s[1]+'<\/button>';
        });
        h+='<\/div>';
        h+='<textarea class="nt" data-note="'+it.id+'" placeholder="הערה (מה לשפר/לשדרג/לשמר)…" '+(canWrite?'':'disabled')+'>'+esc(it.note)+'<\/textarea>';
        h+='<button class="send" data-send="'+it.id+'" '+((canWrite&&it.status)?'':'disabled')+'>✅ שלח למיכאל'+(it.status?'':' (בחר סטטוס)')+'<\/button>';
      }
      h+='<\/div>';
    });
    // ── כפתור-צ'אט צף + סרגל נפתח/נסגר ──
    var nmsg=(state.chat||[]).length;
    h+='<button class="chatfab" id="chatfab">'+(chatOpen?'✕':'💬 צ\'אט'+(nmsg?' ('+nmsg+')':''))+'<\/button>';
    if(chatOpen){
      h+='<div class="chatp">';
      h+='<div class="chath"><b>💬 צ\'אט · מודד ↔ מיכאל<\/b>';
      h+='<button class="rolebtn" id="rolebtn">אני: '+(role==='m'?'מיכאל':'מודד')+'<\/button><\/div>';
      h+='<div class="chatmsgs" id="chatmsgs">';
      if(!nmsg) h+='<p class="dsc" style="text-align:center;padding:24px 8px">אין הודעות עדיין. כתוב למטה 👇<\/p>';
      (state.chat||[]).forEach(function(c){
        h+='<div class="msg '+(c.who===role?'me':'them')+'"><div class="who">'+(c.who==='m'?'מיכאל':'מודד')+'<\/div><div class="bub">'+esc(c.text)+'<\/div><\/div>';
      });
      h+='<\/div>';
      h+='<div class="chatin"><input id="chatta" placeholder="כתוב הודעה…" value="'+esc(chatText)+'" '+(canWrite?'':'disabled')+'><button id="chatsend" '+(canWrite?'':'disabled')+'>שלח<\/button><\/div>';
      h+='<\/div>';
    }
    if(viewImg){ h+='<div class="lightbox" id="lb"><img alt="צילום-מסך" src="'+viewImg+'"><button class="lbx" id="lbx">✕ סגור<\/button><\/div>'; }
    h+='<footer>Soline — דו״ח מודד · '+(msg==='saving'?'שומר…':(msg==='saved'?'נשמר ✓':'נשמר אוטומטית'))+'<\/footer>';
    h+='<\/div>';
    root.innerHTML=h;
    // handlers
    root.querySelectorAll('.sb').forEach(function(b){
      b.onclick=function(){ if(canWrite) setStatus(b.getAttribute('data-id'), b.getAttribute('data-k')); };
    });
    root.querySelectorAll('.nt').forEach(function(t){
      t.oninput=function(){ if(canWrite) setNote(t.getAttribute('data-note'), t.value); };
    });
    root.querySelectorAll('.send').forEach(function(b){
      b.onclick=function(){ if(canWrite&&!b.disabled&&b.getAttribute('data-send')) submit(b.getAttribute('data-send')); };
    });
    var cfab=document.getElementById('chatfab');
    if(cfab) cfab.onclick=function(){ chatOpen=!chatOpen; render(); if(chatOpen) scrollChat(); };
    var rb=document.getElementById('rolebtn');
    if(rb) rb.onclick=function(){ role=(role==='m')?'s':'m'; try{localStorage.setItem('soline_role',role);}catch(e){} render(); };
    var cta=document.getElementById('chatta');
    if(cta){ cta.oninput=function(){ chatText=cta.value; }; cta.onkeydown=function(e){ if(e.key==='Enter') sendChat(); }; }
    var cs=document.getElementById('chatsend');
    if(cs) cs.onclick=function(){ sendChat(); };
    root.querySelectorAll('.viewbtn').forEach(function(b){
      b.onclick=function(){ var it=state.items.filter(function(i){return i.id===b.getAttribute('data-view');})[0]; if(it&&it.img){ viewImg=it.img; render(); } };
    });
    var lb=document.getElementById('lb'); if(lb){ lb.onclick=function(){ viewImg=null; render(); }; }
  }

  render();
  if(window.claude&&claude.use){
    claude.use('artifact').then(function(a){ artifact=a; canWrite=!!a; render(); });
  } else { artifact=null; render(); }
})();
</script>
