    <!-- s -->
    <path d="M 103 62 C 96 50 62 50 56 72 C 51 88 68 90 79 91 C 90 92 106 96 100 112 C 94 130 62 132 56 116"/>
    <!-- o -->
    <circle cx="182" cy="90" r="35"/>
    <!-- l -->
    <path d="M 261 23 L 261 125"/>
    <!-- i (stem) -->
    <path d="M 305 55 L 305 125"/>
    <!-- n -->
    <path d="M 357 125 L 357 90 A 35 35 0 0 1 427 90 L 427 125"/>
    <!-- e -->
    <path d="M 471 90 L 541 90"/>
    <path d="M 541 90 A 35 35 0 1 0 534.7 110"/>
