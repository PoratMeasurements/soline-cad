  <circle cx="345" cy="28" r="18" fill="#F49A1A"/>
  <!-- tagline -->
  <text x="336" y="207" text-anchor="middle"
        font-family="Poppins, Nunito, 'Segoe UI', Verdana, sans-serif"
        font-size="30" font-weight="600" letter-spacing="7" fill="#1596A8">SMART SPATIAL SOLUTIONS</text>
</svg>
