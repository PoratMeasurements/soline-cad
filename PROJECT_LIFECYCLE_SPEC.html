<title>אפיון מחזור-פרויקט</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="app-css">
  :root{--bg:#FBF4E6;--surface:#FFFFFF;--surface2:#FAF3E2;--ink:#2B2620;--muted:#6E6656;
    --border:#EAD9BC;--accent:#E8890B;--teal:#127C8C;
    --ok:#2E9E6B;--warn:#C77A12;--change:#C6392B;--pend:#B9AE97;
    --shadow:0 1px 2px rgba(74,58,20,.05),0 10px 28px rgba(74,58,20,.09)}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171A;--surface:#1D2328;--surface2:#232a30;
    --ink:#ECE7DB;--muted:#A7A093;--border:#313941;--accent:#F7AC3A;--teal:#43B9CA;
    --ok:#54C08A;--warn:#E5A63C;--change:#E5685A;--pend:#5A5346;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.44)}}
  :root[data-theme=dark]{--bg:#14171A;--surface:#1D2328;--surface2:#232a30;--ink:#ECE7DB;--muted:#A7A093;
    --border:#313941;--accent:#F7AC3A;--teal:#43B9CA;--ok:#54C08A;--warn:#E5A63C;--change:#E5685A;--pend:#5A5346;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.44)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;font-family:Heebo,system-ui,sans-serif;
    line-height:1.6;padding:max(18px,env(safe-area-inset-top)) 16px 90px}
  .wrap{max-width:820px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--border);padding-bottom:18px;margin-bottom:6px}
  .wm{font-family:Poppins,sans-serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1}.wm b{color:var(--teal)}
  .kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:3px}
  .meta{color:var(--muted);font-size:12px;text-align:left;line-height:1.6}
  h1{font-size:27px;font-weight:800;margin:22px 0 6px;letter-spacing:-.01em;text-wrap:balance}
  .lead{font-size:16.5px;color:var(--muted);max-width:64ch;margin:0 0 4px}
  h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:800;
    margin:34px 0 13px;display:flex;align-items:center;gap:9px}
  h2 .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:1px 7px}
  h2::after{content:"";flex:1;height:1.5px;background:var(--border)}
  p{margin:0 0 13px;max-width:66ch}
  strong{font-weight:700}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:13px}
  .flow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
  .fstep{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .fstep b{display:block;font-size:15px;color:var(--ink)}.fstep span{font-size:12px;color:var(--muted)}
  .princ{border-inline-start:5px solid var(--accent);background:var(--surface)}
  .tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
  table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface);font-size:14px}
  th,td{text-align:right;padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:top}
  thead th{background:var(--surface2);font-size:12px;color:var(--muted);font-weight:800}
  tbody tr:last-child td{border-bottom:none}
  .dec{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:17px 19px;margin-bottom:13px;box-shadow:var(--shadow)}
  .dec.approved{border-inline-start:5px solid var(--ok)}.dec.discuss{border-inline-start:5px solid var(--warn)}.dec.change{border-inline-start:5px solid var(--change)}
  .dq{font-weight:800;font-size:16px;margin:0 0 4px}
  .dsub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .tchip{display:inline-block;font-size:10.5px;font-weight:800;color:var(--teal);border:1.5px solid var(--teal);border-radius:6px;padding:1px 7px;vertical-align:middle;margin-inline-end:5px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
  .ob{border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:10px;padding:8px 13px;
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.12s}
  .ob[aria-pressed=true]{color:#fff}
  .ob.ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok)}
  .ob.discuss[aria-pressed=true]{background:var(--warn);border-color:var(--warn)}
  .ob.change[aria-pressed=true]{background:var(--change);border-color:var(--change)}
  .cmt{width:100%;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);
    font-family:inherit;font-size:13.5px;padding:9px 12px;resize:vertical;min-height:38px}
  .cmt:focus{outline:2px solid var(--accent);outline-offset:1px}
  .badge{display:inline-block;margin-top:9px;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;border:1.5px solid var(--border)}
  .badge.ok{color:var(--ok);border-color:var(--ok)}.badge.discuss{color:var(--warn);border-color:var(--warn)}.badge.change{color:var(--change);border-color:var(--change)}
  .banner{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 15px;font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .banner b{color:var(--ink)}.banner.ro{border-inline-start:4px solid var(--warn)}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;text-align:center}
  .chatfab{position:fixed;bottom:16px;inset-inline-start:16px;z-index:90;background:var(--teal);color:#fff;border:none;
    border-radius:999px;padding:11px 18px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
  .chatp{position:fixed;bottom:70px;inset-inline-start:16px;width:min(370px,calc(100vw - 32px));height:min(66vh,460px);
    background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);z-index:90;display:flex;flex-direction:column;overflow:hidden}
  .chath{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2);font-size:14px}
  .rolebtn{background:transparent;border:1.5px solid var(--teal);color:var(--teal);border-radius:999px;padding:4px 12px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
  .cmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;display:flex;flex-direction:column;gap:2px}.msg.me{align-self:flex-start}.msg.them{align-self:flex-end}
  .msg .who{font-size:10.5px;color:var(--muted);font-weight:700;padding:0 5px}
  .msg .bub{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word}
  .msg.me .bub{background:var(--teal);color:#fff}.msg.them .bub{background:var(--surface2);border:1px solid var(--border)}
  .cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
  .cin input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;padding:9px 12px}
  .cin button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:800;cursor:pointer}
  .tog{position:fixed;top:12px;inset-inline-start:12px;width:38px;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;z-index:80}
</style>

<button class="tog" aria-label="מצב-תצוגה" onclick="var r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',d==='dark'?'light':'dark')">◐</button>

<div id="root"></div>

<script id="app-state" type="application/json">
{"decisions":[
{"id":"fields","topic":"פתיחה","q":"שדות טופס-פתיחת-הפרויקט","rec":"שם-לקוח · כתובת-מלאה · דרכי-גישה · שם-מפעל-מזמין · טלפון/איש-קשר · הערות","alt":"מינימלי (לקוח+כתובת) → מהיר אך פחות-מידע בדו״ח","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"pname","topic":"פתיחה","q":"שם-הפרויקט = שם-הלקוח","rec":"כן — שם-הלקוח הוא שם-הפרויקט; שאר-הפרטים נלווים אליו","alt":"שם-פרויקט חופשי נפרד → כפילות ובלבול","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"report","topic":"דו״ח","q":"אילו שדות מופיעים בדו״ח-המדידה","rec":"לקוח · כתובת · דרכי-גישה · מפעל-מזמין · תאריך","alt":"רק לקוח+כתובת → דו״ח דל","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"required","topic":"פתיחה","q":"שדות-חובה מול רשות","rec":"חובה: שם-לקוח + כתובת; השאר רשות","alt":"הכל-רשות → נתונים חסרים בדו״ח","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"home","topic":"מסך-בית","q":"מה נשאר במסך-הבית","rec":"פרויקטים-אחרונים + פתיחת-פרויקט + מרכז-באגים; בלי 'פעולות מהירות'/'ניהול מדידות'/'לו״ז היום'","alt":"רק 'ניהול לו״ז' (בקשת-המודד) → מינימלי מאוד","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"closure","topic":"סגירה","q":"ניסוח וזרימת הסגירה/הגשה","rec":"'סגירת פרויקט והגשה' — כפתור שמופיע רק לאחר סגירת-הפרויקט, ומריץ ייצוא-לממיר + הגשה","alt":"'ייצוא לממיר' גלוי תמיד → מבלבל, לא-בהקשר","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"backup","topic":"גיבוי","q":"מנגנון גיבוי-אוטומטי ל-Drive","rec":"גיבוי בכל שמירת-פרויקט לתיקיית-Drive (SAF, כמו הבאגים)","alt":"גיבוי רק-בסגירה → סיכון-אובדן תוך-כדי-עבודה","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"retention","topic":"שמירה","q":"מדיניות שמירה/מחיקה מהטאבלט","rec":"אחרי אימות שהכל ב-Drive + 7 ימים → מחיקה-אוטומטית מהטאבלט (הנתונים נשארים ב-Drive)","alt":"לא-למחוק → הטאבלט מתמלא בזמן","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"deletebtn","topic":"מדיניות","q":"הסרת כפתור 'מחק פרויקט'","rec":"להסיר — מחיקה-ידנית מיותרת (גיבוי+שמירה אוטומטיים)","alt":"להשאיר עם אישור-כפול","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""},
{"id":"immersive","topic":"UI","q":"מצב-immersive (הסתרת סרגל-מערכת)","rec":"להסתיר סרגלי-מערכת של הטאבלט; חשיפה בהחלקה מהקצה/גלילה","alt":"להשאיר גלוי → גוזל מקום-מסך","opts":["אושר","להכרעה","שאלות"],"choice":null,"comment":""}
],
"chat":[]}
</script>

<script id="app-js">
(function(){
  var cssEl=document.getElementById('app-css'), jsEl=document.getElementById('app-js');
  var state=JSON.parse(document.getElementById('app-state').textContent);
  var artifact=null, canWrite=true, msg='', chatOpen=false, chatText='', role='p';
  try{ role=localStorage.getItem('sol_life_role')||'p'; }catch(e){}
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  var CLS={"אושר":"ok","להכרעה":"discuss","שאלות":"change"};
  var tmr={};

  function buildDoc(s){
    return '<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>אפיון מחזור-פרויקט<\/title>'
      +'<meta name="viewport" content="width=device-width, initial-scale=1">'
      +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">'
      +'<style id="app-css">'+cssEl.textContent+'<\/style><\/head><body>'
      +'<button class="tog" aria-label="מצב" onclick="var r=document.documentElement,d=r.getAttribute(\'data-theme\')||(matchMedia(\'(prefers-color-scheme:dark)\').matches?\'dark\':\'light\');r.setAttribute(\'data-theme\',d===\'dark\'?\'light\':\'dark\')">◐<\/button>'
      +'<div id="root"><\/div>'
      +'<script id="app-state" type="application/json">'+JSON.stringify(s)+'<\/script>'
      +'<script id="app-js">'+jsEl.textContent+'<\/script><\/body><\/html>';
  }
  var publishing=false, again=false;
  async function pub(){ if(!artifact)return; if(publishing){again=true;return;} publishing=true; msg='saving'; render();
    try{ await artifact.publish(buildDoc(state)); msg='saved'; }
    catch(e){ var c=(e&&(e.code||e.name))||''; if(c==='not_writer'||c==='not_granted'){canWrite=false;msg='';} else msg='saved'; }
    publishing=false; render(); if(again){again=false;pub();} }

  function setChoice(id,opt){ var d=state.decisions.filter(function(x){return x.id===id;})[0]; if(!d)return; d.choice=(d.choice===opt)?null:opt; render(); pub(); }
  function setComment(id,txt){ var d=state.decisions.filter(function(x){return x.id===id;})[0]; if(!d)return; d.comment=txt; clearTimeout(tmr[id]); tmr[id]=setTimeout(pub,1000); }
  function sendChat(){ var t=(chatText||'').trim(); if(!t||!canWrite)return; if(!state.chat)state.chat=[]; state.chat.push({who:role,text:t,at:new Date().toISOString()}); chatText=''; render(); pub(); scrollC(); }
  function scrollC(){ setTimeout(function(){var m=document.getElementById('cmsgs'); if(m)m.scrollTop=m.scrollHeight;},30); }
  function decided(){ return state.decisions.filter(function(d){return d.choice;}).length; }

  function render(){
    var root=document.getElementById('root'); if(!root)return;
    var h='<div class="wrap">';
    h+='<div class="top"><div><div class="wm">soline<b>.<\/b><\/div><div class="kick">אפיון · מחזור-חיי-הפרויקט · לאישור<\/div><\/div>'
      +'<div class="meta">אפיון חי<br>'+decided()+'/'+state.decisions.length+' הוכרעו<br>מתעדכן חי<\/div><\/div>';
    h+='<h1>מחזור-חיי-הפרויקט<\/h1>';
    h+='<p class="lead">מבקשות-המודד עולה חזון-מוצר אחד: פתיחה-מסודרת → עבודה → סגירה+הגשה → גיבוי/שמירה. נאשר את האפיון יחד לפני-בנייה, ואז נשחרר בגרסה מרוכזת.<\/p>';
    if(!artifact) h+='<div class="banner">טוען…<\/div>';
    else if(!canWrite) h+='<div class="banner ro"><b>מצב-צפייה.<\/b> לסימון — פתח בחשבון עם הרשאת-עריכה.<\/div>';
    else h+='<div class="banner"><b>איך מחליטים:<\/b> לכל שורה קרא את <b>המלצתי<\/b> ואת החלופה, בחר <b>אושר / להכרעה / שאלות<\/b> + הערה. נשמר אוטומטית. דיון → צ\'אט 💬.<\/div>';

    h+='<h2><span class="n">A<\/span>הזרימה<\/h2>';
    h+='<div class="flow">'
      +'<div class="fstep"><b>1 · פתיחה<\/b><span>טופס-אינטייק מסודר (לקוח/כתובת/גישה/מפעל)<\/span><\/div>'
      +'<div class="fstep"><b>2 · עבודה<\/b><span>מדידה + גיבוי-אוטומטי לכל שמירה<\/span><\/div>'
      +'<div class="fstep"><b>3 · סגירה+הגשה<\/b><span>'+"'סגירת פרויקט והגשה'"+' → ייצוא-לממיר<\/span><\/div>'
      +'<div class="fstep"><b>4 · שמירה<\/b><span>שבוע בטאבלט ואז מחיקה-אוטו (נשאר ב-Drive)<\/span><\/div><\/div>';

    h+='<h2><span class="n">B<\/span>טופס-פתיחת-הפרויקט<\/h2>';
    h+='<div class="tw"><table><thead><tr><th>שדה<\/th><th>חובה?<\/th><th>בדו״ח?<\/th><\/tr><\/thead><tbody>'
      +'<tr><td>שם-לקוח (= שם-הפרויקט)<\/td><td>חובה<\/td><td>✓<\/td><\/tr>'
      +'<tr><td>כתובת-מלאה<\/td><td>חובה<\/td><td>✓<\/td><\/tr>'
      +'<tr><td>דרכי-גישה<\/td><td>רשות<\/td><td>✓<\/td><\/tr>'
      +'<tr><td>שם-מפעל-מזמין<\/td><td>רשות<\/td><td>✓<\/td><\/tr>'
      +'<tr><td>טלפון / איש-קשר<\/td><td>רשות<\/td><td>—<\/td><\/tr>'
      +'<tr><td>הערות<\/td><td>רשות<\/td><td>—<\/td><\/tr>'
      +'<\/tbody><\/table><\/div><p class="dsub">טבלה = הצעת-בסיס; החלטות B/D למטה מכריעות סופית.<\/p>';

    h+='<h2><span class="n">C<\/span>סגירה · גיבוי · שמירה<\/h2>';
    h+='<div class="card princ"><p style="margin:0"><b>סגירה+הגשה:<\/b> כפתור <b>"סגירת פרויקט והגשה"<\/b> מופיע רק אחרי סגירת-הפרויקט ומריץ ייצוא-לממיר. <b>גיבוי:<\/b> כל שמירה → Drive. <b>שמירה:<\/b> אחרי-אימות + 7 ימים → מחיקה-אוטומטית מהטאבלט, הנתונים נשארים ב-Drive. <b>מחיקה-ידנית:<\/b> הכפתור מוסר.<\/p><\/div>';

    h+='<h2><span class="n">?<\/span>החלטות לאישור<\/h2>';
    state.decisions.forEach(function(d){
      var cl=d.choice?(CLS[d.choice]||''):'';
      h+='<div class="dec '+cl+'">';
      h+='<p class="dq"><span class="tchip">'+esc(d.topic||'')+'<\/span> '+esc(d.q)+'<\/p>';
      h+='<p class="dsub"><b style="color:var(--teal)">המלצתי:<\/b> '+esc(d.rec||'')+(d.alt?'<br><b>חלופה:<\/b> '+esc(d.alt):'')+'<\/p>';
      h+='<div class="opts">';
      d.opts.forEach(function(o){ var on=d.choice===o; var ocl=CLS[o]||'ok';
        h+='<button class="ob '+ocl+'" aria-pressed="'+on+'" '+(canWrite?'':'disabled ')+'data-dec="'+d.id+'" data-opt="'+esc(o)+'">'+esc(o)+'<\/button>'; });
      h+='<\/div>';
      h+='<textarea class="cmt" data-cmt="'+d.id+'" placeholder="הערה / נימוק (אופציונלי)…" '+(canWrite?'':'disabled')+'>'+esc(d.comment)+'<\/textarea>';
      if(d.choice) h+='<div class="badge '+cl+'">✓ '+esc(d.choice)+'<\/div>';
      h+='<\/div>';
    });

    var nmsg=(state.chat||[]).length;
    h+='<button class="chatfab" id="chatfab">'+(chatOpen?'✕':'💬 דיון'+(nmsg?' ('+nmsg+')':''))+'<\/button>';
    if(chatOpen){
      h+='<div class="chatp"><div class="chath"><b>💬 דיון · מוצר ↔ פיתוח<\/b>'
        +'<button class="rolebtn" id="rolebtn">אני: '+(role==='p'?'מוצר/מיכאל':'פיתוח')+'<\/button><\/div>';
      h+='<div class="cmsgs" id="cmsgs">';
      if(!nmsg) h+='<p class="dsub" style="text-align:center;padding:24px 8px">אין הודעות. כתוב 👇<\/p>';
      (state.chat||[]).forEach(function(c){ h+='<div class="msg '+(c.who===role?'me':'them')+'"><div class="who">'+(c.who==='p'?'מוצר':'פיתוח')+'<\/div><div class="bub">'+esc(c.text)+'<\/div><\/div>'; });
      h+='<\/div><div class="cin"><input id="cta" placeholder="כתוב הודעה…" value="'+esc(chatText)+'" '+(canWrite?'':'disabled')+'><button id="csend" '+(canWrite?'':'disabled')+'>שלח<\/button><\/div><\/div>';
    }
    h+='<footer>Soline — אפיון מחזור-פרויקט · '+(msg==='saving'?'שומר…':(msg==='saved'?'נשמר ✓':'מתעדכן חי'))+'<\/footer><\/div>';
    root.innerHTML=h;

    root.querySelectorAll('.ob').forEach(function(b){ b.onclick=function(){ if(canWrite) setChoice(b.getAttribute('data-dec'),b.getAttribute('data-opt')); }; });
    root.querySelectorAll('.cmt').forEach(function(t){ t.oninput=function(){ if(canWrite) setComment(t.getAttribute('data-cmt'),t.value); }; });
    var cf=document.getElementById('chatfab'); if(cf) cf.onclick=function(){ chatOpen=!chatOpen; render(); if(chatOpen) scrollC(); };
    var rb=document.getElementById('rolebtn'); if(rb) rb.onclick=function(){ role=(role==='p')?'d':'p'; try{localStorage.setItem('sol_life_role',role);}catch(e){} render(); };
    var cta=document.getElementById('cta'); if(cta){ cta.oninput=function(){chatText=cta.value;}; cta.onkeydown=function(e){ if(e.key==='Enter') sendChat(); }; }
    var cs=document.getElementById('csend'); if(cs) cs.onclick=function(){ sendChat(); };
  }
  render();
  if(window.claude&&claude.use){ claude.use('artifact').then(function(a){ artifact=a; canWrite=!!a; render(); }); }
})();
</script>
